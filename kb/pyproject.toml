[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb"
version = "0.1.0"
description = "A local knowledge base with full-text search"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "flask>=3.0,<4.0",
    "click>=8.0,<9.0",
]

[project.scripts]
kb = "kb.cli:main"

[project.optional-dependencies]
chinese = ["jieba>=0.42"]
markdown = ["markdown>=3.0", "pygments>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}
