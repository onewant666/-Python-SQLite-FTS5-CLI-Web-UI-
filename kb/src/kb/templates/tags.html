{% extends "base.html" %}
{% block title %}Tags{% endblock %}

{% block content %}
<h1>Tags</h1>

{% if tags %}
<div class="tag-cloud-page">
    {% for t in tags %}
    <a href="/tag/{{ t.name }}" style="font-size: {{ t.size }}" class="tag-cloud-item">
        {{ t.name }} <span class="tag-count">{{ t.count }}</span>
    </a>
    {% endfor %}
</div>
{% else %}
<div class="empty-state">
    <p>No tags yet.</p>
</div>
{% endif %}
{% endblock %}
